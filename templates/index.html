<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle Dashboard 控制面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #333; padding: 24px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 6px; color: #1a1a2e; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
.card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.card h2 { font-size: 16px; margin-bottom: 14px; color: #1a1a2e; border-left: 4px solid #4a7cff; padding-left: 10px; }
.status-bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.on { background: #22c55e; }
.dot.off { background: #ef4444; }
.dot.warn { background: #f59e0b; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
button { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
button:hover { opacity: 0.88; transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: #4a7cff; color: #fff; }
.btn-success { background: #22c55e; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-ghost { background: #e5e7eb; color: #333; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-item label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
.form-item input { width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; }
.form-item input:focus { outline: none; border-color: #4a7cff; }
.form-full { grid-column: 1 / -1; }
.msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 14px; display: none; }
.msg.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.log-box { background: #1e293b; color: #cbd5e1; border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 12px; max-height: 300px; overflow-y: auto; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
.log-empty { color: #64748b; }
.updated { color: #94a3b8; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>Kindle Dashboard 控制面板</h1>
  <div class="subtitle">管理 Kindel 仪表盘的配置、刷新与守护进程</div>

  <div class="card">
    <h2>运行状态</h2>
    <div class="status-bar">
      <div class="status-item"><span class="dot" id="dotDaemon"></span><span>守护进程: <b id="daemonState">检测中...</b></span></div>
      <div class="status-item"><span class="dot" id="dotKindle"></span><span>Kindle: <b id="kindleState">检测中...</b></span></div>
      <div class="status-item">刷新周期: <b id="curInterval">-</b> 秒</div>
      <div class="status-item">更新时间: <b id="lastUpdate">-</b></div>
    </div>
    <div class="btn-group" style="margin-top:16px">
      <button class="btn-primary" onclick="doRefresh()">立即刷新</button>
      <button class="btn-success" onclick="startDaemon()">开启自动刷新</button>
      <button class="btn-danger" onclick="stopDaemon()">停止自动刷新</button>
      <button class="btn-ghost" onclick="exitDashboard()">退出仪表盘模式</button>
    </div>
    <div class="msg" id="actionMsg"></div>
  </div>

  <div class="card">
    <h2>参数配置</h2>
    <div class="form-grid">
      <div class="form-item">
        <label>Kindle IP 地址</label>
        <input id="cfg_host" type="text" placeholder="192.168.x.x">
      </div>
      <div class="form-item">
        <label>SSH 端口</label>
        <input id="cfg_port" type="number" placeholder="22">
      </div>
      <div class="form-item">
        <label>SSH 用户名</label>
        <input id="cfg_user" type="text" placeholder="root">
      </div>
      <div class="form-item">
        <label>SSH 密钥路径</label>
        <input id="cfg_key" type="text" placeholder="~/.ssh/id_kindle">
      </div>
      <div class="form-item">
        <label>刷新周期（秒）</label>
        <input id="cfg_interval" type="number" placeholder="240" min="30">
      </div>
      <div class="form-item">
        <label>SSH 超时（秒）</label>
        <input id="cfg_timeout" type="number" placeholder="15">
      </div>
      <div class="form-item">
        <label>SSH 重试次数</label>
        <input id="cfg_retries" type="number" placeholder="3">
      </div>
      <div class="form-item">
        <label>重试间隔（秒）</label>
        <input id="cfg_retry_delay" type="number" placeholder="15">
      </div>
      <div class="form-item form-full">
        <label>DeepSeek Token（网页端，用于真实消费数据）</label>
        <input id="cfg_ds_token" type="password" placeholder="登录 platform.deepseek.com → F12 → Network → Authorization">
      </div>
    </div>
    <div class="btn-group" style="margin-top:16px">
      <button class="btn-ghost" onclick="loadStatus()">重置表单</button>
      <button class="btn-primary" onclick="saveConfig()">保存配置</button>
    </div>
    <div class="msg" id="configMsg"></div>
  </div>

  <div class="card">
    <h2>推送日志</h2>
    <div class="log-box" id="logBox"><div class="log-empty">加载中...</div></div>
    <div class="updated" id="updatedAt"></div>
  </div>
</div>

<script>
let currentConfig = null;

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

function showMsg(elId, ok, text) {
  const el = document.getElementById(elId);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
  setTimeout(() => { el.className = 'msg'; }, 4000);
}

async function loadStatus() {
  try {
    const data = await api('/api/status');
    currentConfig = data.config;

    // daemon状态
    const dotDaemon = document.getElementById('dotDaemon');
    const daemonRunning = data.daemon.running;
    dotDaemon.className = 'dot ' + (daemonRunning ? 'on' : 'off');
    document.getElementById('daemonState').textContent = daemonRunning ? '运行中 (PID ' + (data.daemon.pid||'?') + ')' : '已停止';

    // Kindle状态（从日志粗略判断）
    const dotKindle = document.getElementById('dotKindle');
    const recentLog = (data.log || []).join('\n');
    const lastSuccess = /传输\+刷新成功/.test(recentLog);
    const lastFail = /推送失败|不在线|刷新失败/.test(recentLog);
    let kstate = '未知';
    if (lastSuccess) kstate = '最近刷新成功';
    else if (lastFail) kstate = '最近刷新失败';
    dotKindle.className = 'dot ' + (lastSuccess ? 'on' : (lastFail ? 'warn' : 'off'));
    document.getElementById('kindleState').textContent = kstate;

    document.getElementById('curInterval').textContent = data.config.refresh_interval;
    document.getElementById('lastUpdate').textContent = data.daemon.last_update || '-';

    // 填表
    document.getElementById('cfg_host').value = data.config.kindle_host || '';
    document.getElementById('cfg_port').value = data.config.kindle_port || '';
    document.getElementById('cfg_user').value = data.config.kindle_user || '';
    document.getElementById('cfg_key').value = data.config.ssh_key || '';
    document.getElementById('cfg_interval').value = data.config.refresh_interval || '';
    document.getElementById('cfg_timeout').value = data.config.ssh_timeout || '';
    document.getElementById('cfg_retries').value = data.config.ssh_retries || '';
    document.getElementById('cfg_retry_delay').value = data.config.ssh_retry_delay || '';
    document.getElementById('cfg_ds_token').value = data.config.deepseek_token || '';

    // 日志
    const logBox = document.getElementById('logBox');
    if (data.log && data.log.length) {
      logBox.textContent = data.log.join('\n');
      logBox.scrollTop = logBox.scrollHeight;
    } else {
      logBox.innerHTML = '<div class="log-empty">暂无日志</div>';
    }
    document.getElementById('updatedAt').textContent = '刷新于 ' + data.server_time;
  } catch (e) {
    document.getElementById('logBox').innerHTML = '<div class="log-empty">连接失败: ' + e.message + '</div>';
  }
}

async function doRefresh() {
  const r = await api('/api/refresh', 'POST', {});
  showMsg('actionMsg', r.ok, r.msg);
  setTimeout(loadStatus, 3000);
}

async function startDaemon() {
  const r = await api('/api/daemon/start', 'POST', {});
  showMsg('actionMsg', r.ok, r.msg);
  setTimeout(loadStatus, 2000);
}

async function stopDaemon() {
  const r = await api('/api/daemon/stop', 'POST', {});
  showMsg('actionMsg', r.ok, r.msg);
  setTimeout(loadStatus, 2000);
}

async function exitDashboard() {
  if (!confirm('确认退出仪表盘模式？\nKindle将停止防待机并回到KUAL/原生界面。')) return;
  const r = await api('/api/kindle/exit', 'POST', {});
  showMsg('actionMsg', r.ok, r.msg);
  setTimeout(loadStatus, 3000);
}

async function saveConfig() {
  const cfg = {
    kindle_host: document.getElementById('cfg_host').value.trim(),
    kindle_port: parseInt(document.getElementById('cfg_port').value) || 22,
    kindle_user: document.getElementById('cfg_user').value.trim() || 'root',
    ssh_key: document.getElementById('cfg_key').value.trim() || '~/.ssh/id_kindle',
    refresh_interval: parseInt(document.getElementById('cfg_interval').value) || 240,
    ssh_timeout: parseInt(document.getElementById('cfg_timeout').value) || 15,
    ssh_retries: parseInt(document.getElementById('cfg_retries').value) || 3,
    ssh_retry_delay: parseInt(document.getElementById('cfg_retry_delay').value) || 15,
    deepseek_token: document.getElementById('cfg_ds_token').value.trim(),
  };
  const r = await api('/api/config', 'POST', cfg);
  showMsg('configMsg', r.ok, r.msg);
  if (r.ok) setTimeout(loadStatus, 1000);
}

loadStatus();
setInterval(loadStatus, 15000);
</script>
</body>
</html>
